<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mykonos Power | Gateway</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body
    style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle at center, #0c0032 0%, #05001a 100%); overflow: hidden;">

    <div class="logo" style="margin-bottom: 50px; font-size: 2.5rem; letter-spacing: 2px;">
        <i class="ri-flashlight-fill" style="color: var(--accent-color);"></i> Mykonos Power
    </div>

    <h1 style="margin-bottom: 40px; font-weight: 300; opacity: 0.9;">Welcome to the Unified Portal</h1>

    <div style="display: flex; gap: 30px; max-width: 900px; width: 90%;">
        <!-- Admin Portal Card -->
        <a href="login.html?role=admin" class="card"
            style="flex: 1; text-align: center; padding: 50px; text-decoration: none; transition: var(--transition); border: 1px solid rgba(255,255,255,0.05);">
            <div style="font-size: 4rem; color: var(--accent-color); margin-bottom: 20px;">
                <i class="ri-admin-line"></i>
            </div>
            <h2 style="color: #fff; margin-bottom: 15px;">Administrative Portal</h2>
            <p style="color: rgba(255,255,255,0.6); font-size: 0.95rem;">Manage grid operations, generate tokens, and
                view system analytics.</p>
            <div class="btn" style="margin-top: 30px; width: auto; display: inline-block;">Enter Admin Area</div>
        </a>

        <!-- Customer Portal Card -->
        <a href="login.html?role=customer" class="card"
            style="flex: 1; text-align: center; padding: 50px; text-decoration: none; transition: var(--transition); border: 1px solid rgba(255,255,255,0.05);">
            <div style="font-size: 4rem; color: var(--success-color); margin-bottom: 20px;">
                <i class="ri-user-heart-line"></i>
            </div>
            <h2 style="color: #fff; margin-bottom: 15px;">Customer Self-Service</h2>
            <p style="color: rgba(255,255,255,0.6); font-size: 0.95rem;">Track your usage, buy tokens instantly, and
                view history.</p>
            <div class="btn"
                style="margin-top: 30px; width: auto; display: inline-block; background: var(--success-color);">Go to My
                Account</div>
        </a>
    </div>

    <p style="margin-top: 50px; color: rgba(255,255,255,0.3); font-size: 0.8rem;">&copy; 2026 Mykonos Power Enterprise
        Solutions</p>

    <style>
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color) !important;
            background: rgba(255, 255, 255, 0.03);
        }
    </style>
</body>

</html>
