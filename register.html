<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mykonos Power | Register</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body
    style="display: flex; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle at center, #0c0032 0%, #05001a 100%);">
    <div class="card centered-card" style="max-width: 450px; padding: 40px;">
        <div class="logo" style="justify-content: center; margin-bottom: 30px;">
            <i class="ri-flashlight-fill" style="color: var(--accent-color);"></i> Mykonos Power
        </div>
        <h2 style="text-align: center; margin-bottom: 30px;">Create Account</h2>
        <form id="register-form">
            <div class="form-group slide-up stagger-2">
                <label class="form-label">Full Name</label>
                <input type="text" id="reg-name" class="form-input" placeholder="Enter your full name" required>
            </div>
            <div class="form-group slide-up stagger-2">
                <label class="form-label">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="Ensure this is active" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="reg-password" class="form-input" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 20px;">Register Account</button>
        </form>
        <p style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: rgba(255,255,255,0.6);">
            Already have an account? <a href="login.html"
                style="color: var(--accent-color); text-decoration: none; font-weight: 600;">Login here</a>
        </p>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Registering...';
            btn.disabled = true;

            const success = await Auth.register(name, email, password);
            if (success) {
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            } else {
                alert('Registration failed. Please try again.');
                btn.innerHTML = 'Register Account';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
